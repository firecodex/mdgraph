[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mdgraph-ai"
version = "0.1.1"
description = "A vectorless Open Knowledge Format (OKF) context engine for agentic AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MdGraph Contributors", email = "info@mdgraph.dev" }
]
keywords = [
    "mdgraph-ai",
    "mdgraph",
    "md-graph",
    "open knowledge format",
    "okf",
    "graph storage",
    "vectorless context engine",
    "agentic ai",
    "knowledge graph",
    "markdown graph",
    "fastmcp",
    "mcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers"
]

dependencies = [
    "pydantic>=2.5.0",
    "python-frontmatter>=1.0.0",
    "pyyaml>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "fastmcp>=0.1.0",
    "mcp>=1.0.0",
    "litellm>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.25.0",
    "youtube-transcript-api>=0.6.0",
    "pypdf>=3.17.0",
    "starlette>=0.28.0",
    "uvicorn>=0.23.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.6",
]
postgres = [
    "psycopg[binary]>=3.1.0"
]
all = [
    "mdgraph-ai[dev,postgres,api]"
]

[project.urls]
Homepage = "https://mdgraph.dev"
Documentation = "https://mdgraph.dev/#architecture"
Repository = "https://github.com/firecodex/mdgraph"
Issues = "https://github.com/firecodex/mdgraph/issues"
Changelog = "https://github.com/firecodex/mdgraph/blob/main/CHANGELOG.md"

[project.scripts]
mdgraph = "mdgraph.cli:main"
mdgraph-ai = "mdgraph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mdgraph"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/mdgraph"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError"
]
